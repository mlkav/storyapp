[versions]
agp = "9.3.2"
kotlin = "2.0.0"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
swiperefreshlayout = "1.1.0"
material = "1.14.0"
constraintlayout = "2.2.0"
retrofit = "2.11.0"
loggingInterceptor = "4.12.0"
lifecycle = "2.8.5"
datastore = "1.1.1"
glide = "4.16.0"
activityKtx = "1.9.2"
fragmentKtx = "1.8.3"
